<!DOCTYPE html>
<html lang="en">
<head>
  <!-- iOS Web App Capability (Opens fullscreen like a native app) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kuchipu ❤️">

  <!-- iOS Home Screen App Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/app-icon.png">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <meta name="theme-color" content="#FFE4E6">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Special Scrapbook 📸</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase App & Firestore (Free Tier / No Storage Bucket Required) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cottonpink: '#FDF2F4',
            rosewater: '#FFE4E6',
            deeppink: '#E11D48',
            warmcream: '#FFFDF9',
          },
          fontFamily: {
            script: ['"Great Vibes"', 'cursive'],
            handwritten: ['"Caveat"', 'cursive'],
            serifTitle: ['"Playfair Display"', 'serif'],
            body: ['"Nunito"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Floating Heart Background Animation */
    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.6) rotate(0deg);
        opacity: 0.8;
      }
      50% { opacity: 0.6; }
      100% {
        transform: translateY(-10vh) scale(1.1) rotate(360deg);
        opacity: 0;
      }
    }

    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      animation: floatUp 8s linear infinite;
    }

    /* Polaroid Card Styling */
    .polaroid {
      background: #ffffff;
      padding: 14px 14px 18px 14px;
      box-shadow: 0 10px 25px rgba(225, 29, 72, 0.1), 0 4px 10px rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    .polaroid:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 35px rgba(225, 29, 72, 0.22);
      z-index: 20;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-cottonpink via-rosewater to-pink-100 text-stone-700 font-body min-h-screen py-10 px-4 relative overflow-x-hidden selection:bg-rose-200">

  <!-- Floating Hearts Background -->
  <div id="hearts-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

  <div class="relative z-10 max-w-5xl mx-auto">

    <!-- Top Navigation -->
    <div class="flex items-center justify-between mb-8">
      <button onclick="goBack()" class="inline-flex items-center gap-2 px-5 py-2.5 bg-white/80 hover:bg-white text-deeppink font-bold text-sm rounded-full shadow-sm hover:shadow active:scale-95 transition border border-pink-200 cursor-pointer">
        ← Back to Memory Capsule
      </button>
      
      <!-- ADD PHOTO BUTTON -->
      <button onclick="toggleUploadDrawer()" class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-pink-500 to-deeppink text-white font-bold text-sm rounded-full shadow-md hover:brightness-105 active:scale-95 transition cursor-pointer">
        <span>+ Add Memory</span> 📸
      </button>
    </div>

    <!-- Header Section -->
    <header class="text-center mb-10">
      <span class="inline-block px-4 py-1.5 rounded-full bg-white/70 backdrop-blur-md text-deeppink text-xs font-bold tracking-wider uppercase mb-3 shadow-sm border border-pink-200">
        Our Shared Scrapbook
      </span>
      <h1 class="text-4xl sm:text-6xl font-serifTitle font-bold text-pink-900 tracking-tight mb-2">
        Our Favorite Moments
      </h1>
      <p class="font-script text-3xl sm:text-4xl text-deeppink">
        Every moment with you is my absolute favorite
      </p>
      <p class="text-xs text-stone-400 mt-2 italic">Tap any photo to zoom in 🔍</p>
    </header>

    <!-- UPLOAD DRAWER MODAL (Add New Memory) -->
    <div id="upload-drawer" class="hidden mb-12 bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl border border-pink-200 max-w-lg mx-auto transition-all">
      <div class="flex justify-between items-center mb-5">
        <h3 class="font-serifTitle font-bold text-xl text-stone-800">Add a New Memory</h3>
        <button onclick="toggleUploadDrawer()" class="text-stone-400 hover:text-deeppink font-bold text-lg">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">Select Photo / Take Picture</label>
          <input type="file" id="photo-input" accept="image/*" class="w-full text-xs text-stone-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-100 file:text-deeppink hover:file:bg-pink-200 cursor-pointer" />
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">Sweet Note or Caption</label>
          <input type="text" id="caption-input" placeholder="e.g. Unplanned dessert date..." class="w-full px-3 py-2 text-sm border border-pink-200 rounded-xl focus:outline-none focus:border-deeppink" />
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">Location / Landmark</label>
          <div class="flex gap-2">
            <input type="text" id="location-input" placeholder="e.g. Our favorite cafe" class="w-full px-3 py-2 text-sm border border-pink-200 rounded-xl focus:outline-none focus:border-deeppink" />
            <button onclick="detectGPSLocation('location-input')" type="button" class="px-3 py-2 bg-pink-100 hover:bg-pink-200 text-deeppink text-xs font-bold rounded-xl whitespace-nowrap transition">
              📍 Auto-GPS
            </button>
          </div>
        </div>

        <button id="upload-btn" onclick="saveMemory()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-deeppink text-white font-bold text-sm rounded-xl shadow hover:brightness-105 active:scale-95 transition">
          Save to Scrapbook ✨
        </button>
        <p id="upload-status" class="text-xs text-center text-deeppink font-bold hidden"></p>
      </div>
    </div>

    <!-- EDIT MODAL (Modify Existing Memory) -->
    <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl border border-pink-200 relative" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-5">
          <h3 class="font-serifTitle font-bold text-xl text-stone-800">Edit Memory ✏️</h3>
          <button onclick="closeEditModal()" class="text-stone-400 hover:text-deeppink font-bold text-lg">✕</button>
        </div>

        <input type="hidden" id="edit-doc-id" />
        <input type="hidden" id="edit-existing-image" />

        <div class="space-y-4">
          <!-- Current Image Preview with Option to Replace -->
          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">Photo Preview</label>
            <div class="w-full h-36 rounded-xl overflow-hidden bg-pink-50 mb-2 border border-pink-100">
              <img id="edit-preview-img" src="" class="w-full h-full object-cover" />
            </div>
            <label class="block text-[11px] text-stone-500 mb-1">Change photo (optional):</label>
            <input type="file" id="edit-photo-input" accept="image/*" class="w-full text-xs text-stone-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-100 file:text-deeppink hover:file:bg-pink-200 cursor-pointer" />
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">Sweet Note or Caption</label>
            <input type="text" id="edit-caption-input" class="w-full px-3 py-2 text-sm border border-pink-200 rounded-xl focus:outline-none focus:border-deeppink" />
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">Location / Landmark</label>
            <div class="flex gap-2">
              <input type="text" id="edit-location-input" class="w-full px-3 py-2 text-sm border border-pink-200 rounded-xl focus:outline-none focus:border-deeppink" />
              <button onclick="detectGPSLocation('edit-location-input')" type="button" class="px-3 py-2 bg-pink-100 hover:bg-pink-200 text-deeppink text-xs font-bold rounded-xl whitespace-nowrap transition">
                📍 Auto-GPS
              </button>
            </div>
          </div>

          <button id="edit-save-btn" onclick="saveEditedMemory()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-deeppink text-white font-bold text-sm rounded-xl shadow hover:brightness-105 active:scale-95 transition">
            Update Memory ✨
          </button>
          <p id="edit-status" class="text-xs text-center text-deeppink font-bold hidden"></p>
        </div>
      </div>
    </div>

    <!-- LIVE CLOUD SCRAPBOOK GRID -->
    <div id="scrapbook-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 px-2 sm:px-4">
      <div class="col-span-full text-center py-12 text-stone-400">
        Loading memories... 🌸
      </div>
    </div>

    <!-- Bottom Action Button -->
    <div class="text-center mt-16 mb-8">
      <button onclick="goBack()" class="inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-pink-500 to-deeppink text-white font-bold rounded-2xl shadow-lg hover:shadow-pink-300/50 hover:brightness-105 active:scale-95 transition-all cursor-pointer">
        <span>← Return to Capsule</span>
        <span class="text-lg">💌</span>
      </button>
    </div>

  </div>

  <!-- Zoom Modal (Lightbox) -->
  <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
    <div class="relative max-w-2xl max-h-[85vh] p-3 bg-white rounded-2xl shadow-2xl flex flex-col items-center" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Enlarged Memory" class="max-h-[68vh] w-auto rounded-xl object-contain">
      <p id="lightbox-caption" class="font-handwritten text-2xl text-stone-800 mt-3 text-center"></p>
      <button onclick="closeLightbox()" class="mt-2 text-xs text-stone-400 underline cursor-pointer">Tap outside to close</button>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // ====================================================
    // 1. FIREBASE CONFIGURATION
    // ====================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCM1Ut7EPj1NXsHV5t3MH8c0BJK8glj6ok",
      authDomain: "time-capsule-kuchipu.firebaseapp.com",
      projectId: "time-capsule-kuchipu",
      storageBucket: "time-capsule-kuchipu.firebasestorage.app",
      messagingSenderId: "199495526518",
      appId: "1:199495526518:web:2fc4e751309f442f289757",
      measurementId: "G-TDKCYZ39VY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ====================================================
    // 2. CLOUDINARY CONFIGURATION (25 GB Free Storage)
    // ====================================================
    const CLOUDINARY_CLOUD_NAME = "dafthaop";[cite: 6]
    const CLOUDINARY_UPLOAD_PRESET = "kuchipu";[cite: 6]

    // Cache of current items for editing
    const memoryCache = {};

    // ====================================================
    // NAVIGATION & MODAL CONTROLS
    // ====================================================
    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }

    function toggleUploadDrawer() {
      document.getElementById('upload-drawer').classList.toggle('hidden');
    }

    function openEditModal(docId) {
      const item = memoryCache[docId];
      if (!item) return;

      document.getElementById('edit-doc-id').value = docId;
      document.getElementById('edit-existing-image').value = item.imageUrl;
      document.getElementById('edit-preview-img').src = item.imageUrl;
      document.getElementById('edit-caption-input').value = item.caption || "";
      document.getElementById('edit-location-input').value = item.location || "";
      document.getElementById('edit-photo-input').value = "";
      document.getElementById('edit-status').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    // ====================================================
    // 3. AUTO-GPS LOCATION DETECTOR
    // ====================================================
    function detectGPSLocation(targetInputId) {
      const locInput = document.getElementById(targetInputId);
      if (!navigator.geolocation) {
        alert("Location is not supported on this browser.");
        return;
      }
      locInput.value = "Fetching GPS...";
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            const place = data.address.suburb || data.address.city || data.address.town || data.address.state || "Special Place";
            locInput.value = `📍 ${place}`;
          } catch {
            locInput.value = `📍 ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
          }
        },
        () => { locInput.value = "📍 Location access denied"; }
      );
    }

    // ====================================================
    // 4. CLOUDINARY DIRECT UPLOADER
    // ====================================================
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error ? errorData.error.message : "Cloudinary upload failed");
      }

      const data = await response.json();
      return data.secure_url;
    }

    // ====================================================
    // 5. ADD NEW MEMORY
    // ====================================================
    async function saveMemory() {
      const fileInput = document.getElementById('photo-input');
      const caption = document.getElementById('caption-input').value.trim();
      const location = document.getElementById('location-input').value.trim() || "Everywhere with you";
      const btn = document.getElementById('upload-btn');
      const status = document.getElementById('upload-status');

      if (!fileInput.files[0]) {
        alert("Please select a picture first!");
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.innerText = "Uploading to Cloud...";
      status.classList.remove('hidden');
      status.innerText = "Uploading photo to Cloudinary... ⏳";

      try {
        const imageUrl = await uploadToCloudinary(file);

        status.innerText = "Saving to scrapbook database... ⏳";

        await db.collection("scrapbook").add({
          imageUrl: imageUrl,
          caption: caption || "Favorite moments ❤️",
          location: location,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        fileInput.value = "";
        document.getElementById('caption-input').value = "";
        document.getElementById('location-input').value = "";
        status.innerText = "Saved successfully! 🎉";
        btn.disabled = false;
        btn.innerText = "Save to Scrapbook ✨";
        
        setTimeout(() => {
          status.classList.add('hidden');
          toggleUploadDrawer();
        }, 1200);

        if (typeof confetti === 'function') confetti({ particleCount: 35, spread: 60 });

      } catch (err) {
        console.error(err);
        alert("Error saving: " + err.message);
        btn.disabled = false;
        btn.innerText = "Save to Scrapbook ✨";
        status.classList.add('hidden');
      }
    }

    // ====================================================
    // 6. UPDATE EXISTING MEMORY (Edit)
    // ====================================================
    async function saveEditedMemory() {
      const docId = document.getElementById('edit-doc-id').value;
      const caption = document.getElementById('edit-caption-input').value.trim();
      const location = document.getElementById('edit-location-input').value.trim() || "Everywhere with you";
      const fileInput = document.getElementById('edit-photo-input');
      const btn = document.getElementById('edit-save-btn');
      const status = document.getElementById('edit-status');

      btn.disabled = true;
      btn.innerText = "Updating...";
      status.classList.remove('hidden');
      status.innerText = "Saving changes... ⏳";

      try {
        let finalImage = document.getElementById('edit-existing-image').value;

        if (fileInput.files && fileInput.files[0]) {
          status.innerText = "Uploading new photo to Cloudinary... ⏳";
          finalImage = await uploadToCloudinary(fileInput.files[0]);
        }

        await db.collection("scrapbook").doc(docId).update({
          imageUrl: finalImage,
          caption: caption || "Favorite moments ❤️",
          location: location
        });

        status.innerText = "Updated successfully! 🎉";
        btn.disabled = false;
        btn.innerText = "Update Memory ✨";

        setTimeout(() => {
          closeEditModal();
        }, 900);

      } catch (err) {
        console.error("Error updating: ", err);
        alert("Error updating memory: " + err.message);
        btn.disabled = false;
        btn.innerText = "Update Memory ✨";
        status.classList.add('hidden');
      }
    }

    // ====================================================
    // 7. DELETE MEMORY
    // ====================================================
    async function deleteMemory(docId) {
      const confirmDelete = confirm("Are you sure you want to remove this memory from our scrapbook?");
      if (!confirmDelete) return;

      try {
        await db.collection("scrapbook").doc(docId).delete();
      } catch (err) {
        console.error("Error deleting memory: ", err);
        alert("Could not delete: " + err.message);
      }
    }

    function escapeHtmlQuotes(str) {
      if (!str) return "";
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ====================================================
    // 8. REAL-TIME SYNC (With Visible Edit & Delete Toolbar)
    // ====================================================
    db.collection("scrapbook")
      .orderBy("timestamp", "desc")
      .onSnapshot((snapshot) => {
        const grid = document.getElementById('scrapbook-grid');
        grid.innerHTML = "";

        if (snapshot.empty) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-12 text-stone-400">
              No memories uploaded yet! Tap "+ Add Memory" above to add your first photo. 🌸
            </div>`;
          return;
        }

        snapshot.forEach((doc) => {
          const item = doc.data();
          const docId = doc.id;
          memoryCache[docId] = item;

          const polaroid = document.createElement('div');
          polaroid.className = "polaroid flex flex-col justify-between";
          
          polaroid.innerHTML = `
            <!-- Clickable Picture & Note Area -->
            <div onclick="openLightbox('${item.imageUrl}', '${escapeHtmlQuotes(item.caption)}')" class="cursor-pointer">
              <div class="w-full h-64 overflow-hidden rounded-lg bg-pink-50 mb-3">
                <img src="${item.imageUrl}" alt="Memory" class="w-full h-full object-cover">
              </div>
              <p class="font-handwritten text-2xl text-stone-800 text-center leading-snug">${item.caption}</p>
              <div class="flex items-center justify-center gap-1 text-[11px] text-deeppink font-semibold mt-1 mb-2">
                <span>${item.location}</span>
              </div>
            </div>

            <!-- Bottom Action Toolbar (Permanently Visible) -->
            <div class="pt-2 mt-2 border-t border-pink-100 flex items-center justify-end gap-2">
              <button 
                type="button"
                onclick="event.stopPropagation(); openEditModal('${docId}')" 
                title="Edit this memory"
                class="px-2.5 py-1 bg-pink-50 hover:bg-pink-100 text-deeppink text-xs font-bold rounded-lg border border-pink-200 shadow-sm flex items-center gap-1 transition active:scale-95 cursor-pointer"
              >
                <span>✏️</span> Edit
              </button>
              <button 
                type="button"
                onclick="event.stopPropagation(); deleteMemory('${docId}')" 
                title="Delete this memory"
                class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-red-600 text-xs font-bold rounded-lg border border-rose-200 shadow-sm flex items-center gap-1 transition active:scale-95 cursor-pointer"
              >
                <span>🗑️</span> Delete
              </button>
            </div>
          `;
          grid.appendChild(polaroid);
        });
      });

    // ====================================================
    // 9. FLOATING HEARTS & LIGHTBOX
    // ====================================================
    function createFloatingHearts() {
      const container = document.getElementById('hearts-container');
      const heartEmojis = ['❤️', '✨', '🌸', '💖', '🫶🏻', '🤍', '💌'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-particle select-none';
        heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 95 + 'vw';
        heart.style.animationDuration = (6 + Math.random() * 8) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        heart.style.fontSize = (16 + Math.random() * 20) + 'px';
        container.appendChild(heart);
      }
    }
    createFloatingHearts();

    function openLightbox(imgSrc, captionText) {
      document.getElementById('lightbox-img').src = imgSrc;
      document.getElementById('lightbox-caption').innerText = captionText;
      document.getElementById('lightbox').classList.remove('hidden');

      if (typeof confetti === 'function') {
        confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
      }
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }
  </script>
</body>
</html>
