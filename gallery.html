  <style>

      100% {
        transform: translateY(-10vh) scale(1.1) rotate(360deg);

      }
    }

    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 0;

    .polaroid {
      background: #ffffff;

      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

    }
    .polaroid:hover {
      transform: translateY(-6px) scale(1.02);

      <h1 class="text-4xl sm:text-6xl font-serifTitle font-bold text-pink-900 tracking-tight mb-2">
        Our Favorite Moments

    <!-- EDIT MODAL (Modify Existing Memory) -->

        <div class="flex justify-between items-center mb-5">

          <button type="button" onclick="closeEditModal()" class="text-stone-400 hover:text-deeppink font-bold text-lg">✕</button>

          <div>

            <div class="flex gap-2">
              <input type="text" id="edit-location-input" class="w-full px-3 py-2 text-sm border border-pink-200 rounded-xl focus:outline-none focus:border-deeppink" />
              <button onclick="detectGPSLocation('edit-location-input')" type="button" class="px-3 py-2 bg-pink-100 hover:bg-pink-200 text-deeppink text-xs font-bold rounded-xl whitespace-nowrap transition cursor-pointer">
                📍 Auto-GPS

            </div>
          </div>

          <button type="button" id="edit-save-btn" onclick="saveEditedMemory()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-deeppink text-white font-bold text-sm rounded-xl shadow hover:brightness-105 active:scale-95 transition cursor-pointer">
            Update Memory ✨

          <p id="edit-status" class="text-xs text-center text-deeppink font-bold hidden"></p>
        </div>
      </div>
    </div>

    <!-- LIVE CLOUD SCRAPBOOK GRID -->
    <div id="scrapbook-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 px-2 sm:px-4">
      <div class="col-span-full text-center py-12 text-stone-400">

      </div>

    <!-- Bottom Action Button -->
    <div class="text-center mt-16 mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-pink-500 to-deeppink text-white font-bold rounded-2xl shadow-lg hover:shadow-pink-300/50 hover:brightness-105 active:scale-95 transition-all cursor-pointer">
        <span>← Return to Capsule</span>
        <span class="text-lg">💌</span>
      </a>
    </div>

  </div>

  <!-- Zoom Modal (Lightbox for Photos & Videos) -->
  <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
    <div class="relative max-w-2xl max-h-[85vh] p-3 bg-white rounded-2xl shadow-2xl flex flex-col items-center" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Enlarged Memory" class="hidden max-h-[68vh] w-auto rounded-xl object-contain">
      <video id="lightbox-video" src="" controls playsinline class="hidden max-h-[68vh] w-auto rounded-xl object-contain bg-black"></video>
      <p id="lightbox-caption" class="font-handwritten text-2xl text-stone-800 mt-3 text-center"></p>
      <button type="button" onclick="closeLightbox()" class="mt-2 text-xs text-stone-400 underline cursor-pointer">Tap outside to close</button>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCM1Ut7EPj1NXsHV5t3MH8c0BJK8glj6ok",
      authDomain: "time-capsule-kuchipu.firebaseapp.com",
      projectId: "time-capsule-kuchipu",
      storageBucket: "time-capsule-kuchipu.firebasestorage.app",
      messagingSenderId: "199495526518",
      appId: "1:199495526518:web:2fc4e751309f442f289757",
      measurementId: "G-TDKCYZ39VY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // Cache scrapbook data locally on the phone so it opens instantly
db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
  // If multi-tab persistence is restricted, fall back gracefully
  if (err.code !== 'failed-precondition' && err.code !== 'unimplemented') {
    console.warn("Persistence error:", err);
  }
});

    // 2. Cloudinary Credentials (Strictly valid JavaScript strings)
    const CLOUDINARY_CLOUD_NAME = "dafthaop";
    const CLOUDINARY_UPLOAD_PRESET = "kuchipu";

    const memoryCache = {};

    function toggleUploadDrawer() {
      document.getElementById('upload-drawer').classList.toggle('hidden');
    }

    function openEditModal(docId) {
      const item = memoryCache[docId];
      if (!item) return;

      document.getElementById('edit-doc-id').value = docId;
      document.getElementById('edit-existing-image').value = item.imageUrl;
      document.getElementById('edit-preview-img').src = item.imageUrl;
      document.getElementById('edit-caption-input').value = item.caption || "";
      document.getElementById('edit-location-input').value = item.location || "";
      document.getElementById('edit-photo-input').value = "";
      document.getElementById('edit-status').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    // 3. Auto-GPS Location Detector
    function detectGPSLocation(targetInputId) {
      const locInput = document.getElementById(targetInputId);
      if (!navigator.geolocation) {
        alert("Location is not supported on this browser.");
        return;
      }
      locInput.value = "Fetching GPS...";
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            const place = data.address.suburb || data.address.city || data.address.town || data.address.state || "Special Place";
            locInput.value = `📍 ${place}`;
          } catch {
            locInput.value = `📍 ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
          }
        },
        () => { locInput.value = "📍 Location access denied"; }
      );
    }

    // 4. Client-Side Image Compression & Cloudinary Uploader
    function compressImageBeforeUpload(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_DIMENSION = 1400; // Crisp full-HD resolution
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_DIMENSION) {
                height = Math.round((height * MAX_DIMENSION) / width);
                width = MAX_DIMENSION;
              }
            } else {
              if (height > MAX_DIMENSION) {
                width = Math.round((width * MAX_DIMENSION) / height);
                height = MAX_DIMENSION;
              }
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                resolve(file);
              }
            }, 'image/webp', 0.80);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    async function uploadToCloudinary(file) {
      const isVideo = file.type.startsWith("video/");
      const endpoint = isVideo 
        ? `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`
        : `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

      const formData = new FormData();

      if (isVideo) {
        // Videos are uploaded directly without canvas compression
        formData.append("file", file);
      } else {
        // Photos are compressed in-browser first
        const compressedBlob = await compressImageBeforeUpload(file);
        formData.append("file", compressedBlob, "memory.webp");
      }

      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(endpoint, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error ? errorData.error.message : "Cloudinary upload failed");
      }

      const data = await response.json();
      return {
        url: data.secure_url,
        mediaType: isVideo ? "video" : "image"
      };
    }
    //SaveMemory File
    async function saveMemory() {
      const fileInput = document.getElementById('photo-input');
      const caption = document.getElementById('caption-input').value.trim();
      const location = document.getElementById('location-input').value.trim() || "Everywhere with you";
      const btn = document.getElementById('upload-btn');
      const status = document.getElementById('upload-status');

      if (!fileInput.files[0]) {
        alert("Please select a picture or video first!");
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.innerText = "Uploading to Cloud...";
      status.classList.remove('hidden');
      status.innerText = file.type.startsWith("video/") 
        ? "Uploading video to Cloudinary... ⏳" 
        : "Compressing & saving photo... ⏳";

      try {
        const { url: mediaUrl, mediaType } = await uploadToCloudinary(file);

        status.innerText = "Saving to scrapbook database... ⏳";

        await db.collection("scrapbook").add({
          imageUrl: mediaUrl,
          mediaType: mediaType,
          caption: caption || "Favorite moments ❤️",
          location: location,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        fileInput.value = "";
        document.getElementById('caption-input').value = "";
        document.getElementById('location-input').value = "";
        status.innerText = "Saved successfully! 🎉";
        btn.disabled = false;
        btn.innerText = "Save to Scrapbook ✨";
        
        setTimeout(() => {
          status.classList.add('hidden');
          toggleUploadDrawer();
        }, 1200);

        if (typeof confetti === 'function') confetti({ particleCount: 35, spread: 60 });

      } catch (err) {
        console.error(err);
        alert("Error saving: " + err.message);
        btn.disabled = false;
        btn.innerText = "Save to Scrapbook ✨";
        status.classList.add('hidden');
      }
    }

    // 6. Update Existing Memory
    async function saveEditedMemory() {
      const docId = document.getElementById('edit-doc-id').value;
      const caption = document.getElementById('edit-caption-input').value.trim();
      const location = document.getElementById('edit-location-input').value.trim() || "Everywhere with you";
      const fileInput = document.getElementById('edit-photo-input');
      const btn = document.getElementById('edit-save-btn');
      const status = document.getElementById('edit-status');

      btn.disabled = true;
      btn.innerText = "Updating...";
      status.classList.remove('hidden');
      status.innerText = "Saving changes... ⏳";

      try {
        let finalImage = document.getElementById('edit-existing-image').value;
        let finalMediaType = memoryCache[docId]?.mediaType || (finalImage.endsWith(".mp4") || finalImage.endsWith(".mov") ? "video" : "image");

        if (fileInput.files && fileInput.files[0]) {
          status.innerText = "Uploading new media to Cloudinary... ⏳";
          const res = await uploadToCloudinary(fileInput.files[0]);
          finalImage = res.url;
          finalMediaType = res.mediaType;
        }

        await db.collection("scrapbook").doc(docId).update({
          imageUrl: finalImage,
          mediaType: finalMediaType,
          caption: caption || "Favorite moments ❤️",
          location: location
        });

        status.innerText = "Updated successfully! 🎉";
        btn.disabled = false;
        btn.innerText = "Update Memory ✨";

        setTimeout(() => {
          closeEditModal();
        }, 900);

      } catch (err) {
        console.error("Error updating: ", err);
        alert("Error updating memory: " + err.message);
        btn.disabled = false;
        btn.innerText = "Update Memory ✨";
        status.classList.add('hidden');
      }
    }

    // 7. Delete Memory
    async function deleteMemory(docId) {
      const confirmDelete = confirm("Are you sure you want to remove this memory from our scrapbook?");
      if (!confirmDelete) return;

      try {
        await db.collection("scrapbook").doc(docId).delete();
      } catch (err) {
        console.error("Error deleting memory: ", err);
        alert("Could not delete: " + err.message);
      }
    }

    function escapeHtmlQuotes(str) {
      if (!str) return "";
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // 8. Real-Time Sync Listener
    db.collection("scrapbook")
      .onSnapshot((snapshot) => {
        const grid = document.getElementById('scrapbook-grid');
        grid.innerHTML = "";

        if (snapshot.empty) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-12 text-stone-400">
              No memories uploaded yet! Tap "+ Add Memory" above to add your first photo. 🌸
            </div>`;
          return;
        }

        const docs = [];
        snapshot.forEach((doc) => docs.push({ id: doc.id, data: doc.data() }));

        docs.sort((a, b) => {
          const tA = a.data.timestamp ? (a.data.timestamp.seconds || 0) : 0;
          const tB = b.data.timestamp ? (b.data.timestamp.seconds || 0) : 0;
          return tB - tA;
        });

       // Helper: auto-optimize Cloudinary photos without touching Firestore data
        function getSmartImageUrl(url) {
          if (!url) return '';
          if (url.includes('res.cloudinary.com')) {
            // Delivers mobile-optimized, fast-loading WebP format automatically
            return url.replace('/upload/', '/upload/f_auto,q_auto,w_800,c_limit/');
          }
          // Old Base64 or local images load as-is (untouched)
          return url;
        }

        docs.forEach(({ id: docId, data: item }) => {
          memoryCache[docId] = item;
          const isVideo = item.mediaType === 'video' || (item.imageUrl && (item.imageUrl.endsWith('.mp4') || item.imageUrl.endsWith('.mov')));

          const mediaPreviewHtml = isVideo
            ? `
              <div class="relative w-full h-64 overflow-hidden rounded-lg bg-black mb-3 flex items-center justify-center">
                <video src="${item.imageUrl}" autoplay loop muted playsinline class="w-full h-full object-cover pointer-events-none"></video>
                <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/60 text-white text-[10px] font-bold tracking-wide backdrop-blur-sm">
                  ▶ Video
                </span>
              </div>
            `
            : `
              <div class="w-full h-64 overflow-hidden rounded-lg bg-pink-50 mb-3 flex items-center justify-center">
                <img src="${item.imageUrl}" alt="Memory" loading="lazy" decoding="async" class="w-full h-full object-cover">
              </div>
            `;

          const polaroid = document.createElement('div');
          polaroid.className = "polaroid flex flex-col justify-between";
          
          polaroid.innerHTML = `
            <!-- Clickable Media Area -->
            <div onclick="openLightbox('${item.imageUrl}', '${escapeHtmlQuotes(item.caption)}', ${isVideo})" class="cursor-pointer">
              ${mediaPreviewHtml}
              <p class="font-handwritten text-2xl text-stone-800 text-center leading-snug">${item.caption || "Special Memory"}</p>
              <div class="flex items-center justify-center gap-1 text-[11px] text-deeppink font-semibold mt-1 mb-2">
                <span>${item.location || "Everywhere with you"}</span>
              </div>
            </div>

            <!-- Bottom Action Toolbar -->
            <div class="pt-2 mt-2 border-t border-pink-100 flex items-center justify-end gap-2">
              <button 
                type="button"
                onclick="event.stopPropagation(); openEditModal('${docId}')" 
                title="Edit this memory"
                class="px-2.5 py-1 bg-pink-50 hover:bg-pink-100 text-deeppink text-xs font-bold rounded-lg border border-pink-200 shadow-sm flex items-center gap-1 transition active:scale-95 cursor-pointer"
              >
                <span>✏️</span> Edit
              </button>
              <button 
                type="button"
                onclick="event.stopPropagation(); deleteMemory('${docId}')" 
                title="Delete this memory"
                class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-red-600 text-xs font-bold rounded-lg border border-rose-200 shadow-sm flex items-center gap-1 transition active:scale-95 cursor-pointer"
              >
                <span>🗑️</span> Delete
              </button>
            </div>
          `;
          grid.appendChild(polaroid);
        });
      }, (error) => {
        console.error("Firestore read error: ", error);
        document.getElementById('scrapbook-grid').innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-500 text-sm font-semibold">
            Unable to load memories: ${error.message}
          </div>`;
      });

    // 9. Floating Hearts & Lightbox
    function createFloatingHearts() {
      const container = document.getElementById('hearts-container');
      const heartEmojis = ['❤️', '✨', '🌸', '💖', '🫶🏻', '🤍', '💌'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-particle select-none';
        heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 95 + 'vw';
        heart.style.animationDuration = (6 + Math.random() * 8) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        heart.style.fontSize = (16 + Math.random() * 20) + 'px';
        container.appendChild(heart);
      }
    }
    createFloatingHearts();

    function openLightbox(mediaSrc, captionText, isVideo = false) {
      const imgEl = document.getElementById('lightbox-img');
      const vidEl = document.getElementById('lightbox-video');

      if (isVideo) {
        imgEl.classList.add('hidden');
        vidEl.classList.remove('hidden');
        vidEl.src = mediaSrc;
        vidEl.play().catch(() => {});
      } else {
        vidEl.pause();
        vidEl.classList.add('hidden');
        imgEl.classList.remove('hidden');
        imgEl.src = mediaSrc;
      }

      document.getElementById('lightbox-caption').innerText = captionText;
      document.getElementById('lightbox').classList.remove('hidden');

      if (typeof confetti === 'function') {
        confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
      }
    }

    function closeLightbox() {
      const vidEl = document.getElementById('lightbox-video');
      if (vidEl) {
        vidEl.pause();
        vidEl.src = "";
      }
      document.getElementById('lightbox').classList.add('hidden');
    }
  </script>
</body>
</html>
